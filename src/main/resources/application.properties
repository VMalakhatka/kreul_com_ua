# ------------------------------
# Server
# ------------------------------
server.port=${SERVER_PORT:8083}

# ------------------------------
# MS SQL (Paint_Ua)
# ------------------------------
spring.datasource.url=${MSSQL_URL:jdbc:jtds:sqlserver://149.202.70.209:1433;databaseName=Paint_Ua}
spring.datasource.username=${MSSQL_USER:buh}
spring.datasource.password=${MSSQL_PASS:password}
spring.datasource.driver-class-name=net.sourceforge.jtds.jdbc.Driver

# ------------------------------
# WooCommerce API
# ------------------------------
woocommerce.baseUrl=${WOO_BASE_URL:https://kreul.com.ua/wp-json/wc/v3}
woocommerce.baseLavkaUrl=${WOO_LAVKA_URL:https://kreul.com.ua/wp-json}
woocommerce.key=${WOO_KEY:changeme}
woocommerce.secret=${WOO_SECRET:changeme}
woocommerce.perPage=${WOO_PER_PAGE:100}
woocommerce.timeoutMs=${WOO_TIMEOUT:60000}
woocommerce.maxBatchSize=${WOO_BATCH_SIZE:25}
lang=${APP_LANG:uk}

# ------------------------------
#  OVH Object Storage
# ------------------------------

ovh.s3.endpoint=https://s3.gra.io.cloud.ovh.net
ovh.s3.region=gra
ovh.s3.bucket=kreul-media
ovh.s3.accessKey=${OVH_ACCESS_KEY}
ovh.s3.secretKey=${OVH_SECRET_KEY}
ovh.s3.prefix=wp-content/uploads/
ovh.s3.scheme=https
ovh.s3.publicBaseUrl=https://kreul-media.s3.gra.io.cloud.ovh.net/
ovh.s3.maxResults=200

# application.properties ( ENV)
lavka.apiBase=${API_BASE_URL:https://kreul.com.ua/wp-json/lavka/v1}
lavka.user=${API_USER:lavka-bot}
lavka.appPass=${API_PASS:xxxx xxxx xxxx xxxx}
lavka.timeoutMs=${API_TIMEOUT:15000}

lavka.sku-chunk-size=${LAVKA_SKU_CHUNK_SIZE:1000}
lavka.mssql-max-params=${LAVKA_MSSQL_MAX_PARAMS:2100}

lavka.price-stock-id: ${LAVKA_PRICE_STOCK_ID:7}

lavka.movement-page-size=${LAVKA_MOVEMENT_PAGE_SIZE:500}
lavka.movement-max-days=${LAVKA_MOVEMENT_MAX_DAYS:365}

# ------------------------------
# Folio accounts API
# ------------------------------
lavka.folio.accounts.allowed-operation-types=${LAVKA_FOLIO_ACCOUNT_ALLOWED_OPERATION_TYPES:\u0421\u0427\u0415\u0422}
lavka.folio.accounts.document-type=${LAVKA_FOLIO_ACCOUNT_DOCUMENT_TYPE:\u0421\u0427\u0415\u0422}
lavka.folio.accounts.type-doc=${LAVKA_FOLIO_ACCOUNT_TYPE_DOC:\u0421}
lavka.folio.accounts.movement-vid-doc=${LAVKA_FOLIO_ACCOUNT_MOVEMENT_VID_DOC:\u002A\u0420\u0410\u0417\u041E\u0412\u0410\u042F}

# ------------------------------
# Folio customer balance snapshots
# ------------------------------
lavka.folio.balance-snapshot.scheduled-enabled=${LAVKA_FOLIO_BALANCE_SNAPSHOT_SCHEDULED_ENABLED:true}
lavka.folio.balance-snapshot.cron=${LAVKA_FOLIO_BALANCE_SNAPSHOT_CRON:0 10 0 * * *}
lavka.folio.balance-snapshot.zone=${LAVKA_FOLIO_BALANCE_SNAPSHOT_ZONE:Europe/Kyiv}
lavka.folio.balance-snapshot.lease-seconds=${LAVKA_FOLIO_BALANCE_SNAPSHOT_LEASE_SECONDS:7200}
lavka.folio.balance-snapshot.recovery-enabled=${LAVKA_FOLIO_BALANCE_SNAPSHOT_RECOVERY_ENABLED:true}
lavka.folio.balance-snapshot.recovery-check-ms=${LAVKA_FOLIO_BALANCE_SNAPSHOT_RECOVERY_CHECK_MS:300000}
lavka.folio.balance-snapshot.recovery-initial-delay-ms=${LAVKA_FOLIO_BALANCE_SNAPSHOT_RECOVERY_INITIAL_DELAY_MS:30000}
lavka.folio.balance-snapshot.max-recovery-attempts-per-day=${LAVKA_FOLIO_BALANCE_SNAPSHOT_MAX_RECOVERY_ATTEMPTS_PER_DAY:2}

# ------------------------------
# Folio accounting-price recalculation
# API stays disabled until external /admin authorization is confirmed.
# Full apply remains a separate opt-in because it rebuilds every SKU from saved movement accounting sums.
# ------------------------------
lavka.folio.accounting-prices.apply-enabled=${LAVKA_FOLIO_ACCOUNTING_PRICE_APPLY_ENABLED:false}
lavka.folio.accounting-prices.full-apply-enabled=${LAVKA_FOLIO_ACCOUNTING_PRICE_FULL_APPLY_ENABLED:false}
lavka.folio.accounting-prices.api-enabled=${LAVKA_FOLIO_ACCOUNTING_PRICE_API_ENABLED:false}
lavka.folio.accounting-prices.lock-timeout-ms=${LAVKA_FOLIO_ACCOUNTING_PRICE_LOCK_TIMEOUT_MS:5000}
lavka.folio.accounting-prices.query-timeout-seconds=${LAVKA_FOLIO_ACCOUNTING_PRICE_QUERY_TIMEOUT_SECONDS:120}
lavka.folio.accounting-prices.max-reported-warnings=${LAVKA_FOLIO_ACCOUNTING_PRICE_MAX_REPORTED_WARNINGS:200}
lavka.folio.accounting-prices.zone=${LAVKA_FOLIO_ACCOUNTING_PRICE_ZONE:Europe/Kyiv}

# ------------------------------
# WordPress (MariaDB)
# ------------------------------
wp.datasource.url=${WP_DB_URL:jdbc:mariadb://127.0.0.1:3307/kreul?useUnicode=true&characterEncoding=utf8}
wp.datasource.username=${WP_DB_USER:wpuser}
wp.datasource.password=${WP_DB_PASS:wppass}
wp.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ------------------------------
# Flyway
# ------------------------------
spring.flyway.locations=classpath:db/wp/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.enabled=true

# ------------------------------
# DB Connection tuning
# ------------------------------
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout= 5000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.max-lifetime=1500000


# ------------------------------
# MVC
# ------------------------------
spring.mvc.hiddenmethod.filter.enabled=true
spring.thymeleaf.suffix=.html


management.endpoints.web.base-path=/actuator


management.endpoints.web.exposure.include=health,info


management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ------------------------------
# Logging (Lavka Sync)
# ------------------------------

logging.level.org.springframework.security=DEBUG

# Main level
logging.level.org.example.proect.lavka=INFO
logging.level.org.example.proect.lavka.service.SyncServiceImpl=DEBUG

# input HTTP request (RequestIdFilter)
logging.level.org.example.proect.lavka.web.RequestIdFilter=INFO

# Global Error (GlobalExceptionHandler)
logging.level.org.example.proect.lavka.exception.GlobalExceptionHandler=INFO

# Woo/Lavka client
logging.level.org.example.proect.lavka.client.WooApiClient=DEBUG
logging.level.org.example.proect.lavka.client.LavkaLocationsClient=DEBUG

# If view SQL massage
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.springframework.jdbc.support.SQLErrorCodeSQLExceptionTranslator=DEBUG

# ------------------------------
# Logging (custom path)
# ------------------------------
logging.file.path=${LOG_DIR:logs}
