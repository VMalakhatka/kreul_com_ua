spring.application.name=folio-rus-lab
server.port=${FOLIO_RUS_LAB_PORT:8080}
server.address=${FOLIO_RUS_LAB_BIND_ADDRESS:127.0.0.1}
server.shutdown=graceful

folio.rus.host=${FOLIO_RUS_DB_HOST}
folio.rus.port=${FOLIO_RUS_DB_PORT:1433}
folio.rus.username=${FOLIO_RUS_DB_USER}
folio.rus.password=${FOLIO_RUS_DB_PASSWORD}
folio.rus.login-timeout-seconds=${FOLIO_RUS_DB_LOGIN_TIMEOUT_SECONDS:10}
folio.rus.socket-timeout-seconds=${FOLIO_RUS_DB_SOCKET_TIMEOUT_SECONDS:90}

folio.lab.token=${FOLIO_RUS_API_TOKEN}
folio.lab.default-timeout-seconds=${FOLIO_RUS_LAB_DEFAULT_TIMEOUT_SECONDS:30}
folio.lab.maximum-timeout-seconds=${FOLIO_RUS_LAB_MAX_TIMEOUT_SECONDS:60}
folio.lab.default-max-rows=${FOLIO_RUS_LAB_DEFAULT_MAX_ROWS:5000}
folio.lab.maximum-max-rows=${FOLIO_RUS_LAB_MAX_MAX_ROWS:20000}
folio.lab.default-max-bytes=${FOLIO_RUS_LAB_DEFAULT_MAX_BYTES:5242880}
folio.lab.maximum-max-bytes=${FOLIO_RUS_LAB_MAX_MAX_BYTES:10485760}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.env.enabled=false
management.endpoint.configprops.enabled=false

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.example.folioruslab=INFO

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
