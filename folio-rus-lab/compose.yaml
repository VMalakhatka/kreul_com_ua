name: folio-rus-lab

services:
  api:
    image: folio-rus-lab:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${FOLIO_RUS_ENV_FILE:-env.example}
    environment:
      FOLIO_RUS_LAB_BIND_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:18081:8080"
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
